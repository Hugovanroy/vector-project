name: CI

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate flight data
        run: python3 sim/flight_sim.py

      - name: Compile flight computer
        run: gcc firmware/flight_state.c -o flight

      - name: Run tests
        run: ./flight

      - name: Static analysis
        run: |
          sudo apt-get install -y cppcheck
          cppcheck --error-exitcode=1 firmware/flight_state.c

      - name: Dynamic analysis (sanitizers)
        run: |
          gcc -fsanitize=address,undefined -g firmware/flight_state.c -o flight_san
          ./flight_san